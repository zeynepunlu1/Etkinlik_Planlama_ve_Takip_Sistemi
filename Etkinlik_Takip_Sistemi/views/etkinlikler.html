<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlikleri Keşfet | SYNAPZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="public/style.css">
    <style>
        /* Kartların üst köşelerinin oval kalması ve hover efekti için stiller */
        .event-card {
            overflow: hidden !important;
        }
        .event-card:hover .card-image-container img {
            transform: scale(1.06);
        }
    </style>
</head>
<body>
    <header class="header"> 
        <a href="index.html" class="logo">
            <i class="fa-regular fa-calendar-check"></i> SYNAPZ
        </a>
        <nav class="navbar">
            <a href="index.html">Anasayfa</a>
            <a href="etkinlikler.html" class="active">Etkinlikler</a>
            <a href="hakkimizda.html">Hakkımızda</a>
            <a href="iletisim.html">İletişim</a>
        </nav>
        <div class="header-action">
            <a href="giris_kayit.html" id="girisLink" class="nav-btn">Giriş Yap/Kaydol</a>
        </div>
    </header>

    <div class="discover-container">
        
        <aside class="filter-sidebar">
            <h3><i class="fa-solid fa-sliders"></i> Filtrele & Ara</h3>
            
            <div class="search-group" style="margin-bottom: 25px; position: relative;">
                <label style="font-size: 13px; font-weight: 600; color: #b2bec3; text-transform: uppercase; display: block; margin-bottom: 8px;">Etkinlik Ara</label>
                <input type="text" id="eventSearchInput" onkeyup="liveSearch()" placeholder="Konser, sanatçı veya mekân..." style="width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #eaeaea; border-radius: 10px; background: #f8f9fa; font-size: 14px; outline: none; box-sizing: border-box;">
                <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 15px; bottom: 14px; color: #b2bec3;"></i>
            </div>

            <div class="filter-group">
                <label>Kategoriler</label>
                <button class="filter-btn active" data-category-type="hepsi" onclick="filterCategory('hepsi')">Tüm Etkinlikler</button>
                <button class="filter-btn" data-category-type="Konser" onclick="filterCategory('Konser')"><i class="fa-solid fa-music"></i> Konserler</button>
                <button class="filter-btn" data-category-type="Stand-up" onclick="filterCategory('Stand-up')"><i class="fa-solid fa-microphone"></i> Stand-up</button>
                <button class="filter-btn" data-category-type="Resital" onclick="filterCategory('Resital')"><i class="fa-solid fa-guitar"></i> Resitaller</button>
                <button class="filter-btn" data-category-type="Festival" onclick="filterCategory('Festival')"><i class="fa-solid fa-campground"></i> Festivaller</button>
                <button class="filter-btn" data-category-type="Müzikal" onclick="filterCategory('Müzikal')"><i class="fa-solid fa-masks-theater"></i> Müzikaller</button>
                <button class="filter-btn" data-category-type="Sinema" onclick="filterCategory('Sinema')"><i class="fa-solid fa-film"></i> Sinema</button>
                <button class="filter-btn" data-category-type="Tiyatro" onclick="filterCategory('Tiyatro')"><i class="fa-solid fa-theater-masks"></i> Tiyatrolar</button>
                <button class="filter-btn" data-category-type="Opera" onclick="filterCategory('Opera')"><i class="fa-solid fa-landmark"></i> Operalar</button>
            </div>
        </aside>

        <section class="events-feed">
            <div class="feed-header">
                <h2>Güncel Etkinlikler</h2>
                <p id="sehirProfilMesaji">Şehrindeki en popüler etkinlikleri kaçırma.</p>
            </div>

            <div class="events-grid"></div>
        </section>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const katilimciId = localStorage.getItem('synapz_user_id');
            
            fetch(`/api/etkinlikler?katilimciId=${katilimciId}`)
                .then(response => response.json())
                .then(etkinlikler => {
                    const grid = document.querySelector('.events-grid');
                    grid.innerHTML = ""; 

                    etkinlikler.forEach(etk => {
                        const simdi = new Date();
                        const etkinlikTarihi = new Date(etk.Baslangic_Zamani);
                        const tarih = etkinlikTarihi.toLocaleString('tr-TR');

                        let tamMetin = etk.Aciklama || ""; 
                        let dinamikFiyat = 400;

                        if (tamMetin.includes("|||FIYAT:")) {
                            const parcalar = tamMetin.split("|||FIYAT:");
                            dinamikFiyat = parseFloat(parcalar[1].replace("|||", "").trim());
                        } 
                        else if (etk.fiyat) {
                            dinamikFiyat = parseFloat(etk.fiyat);
                        }
                        
                        const kartFiyati = dinamikFiyat;

                        let resimUrl = "public/images/hakkımızda.jpeg"; 
                        
                        const kategoriTemiz = (etk.Etkinlik_Kategori || "").toLowerCase().trim();

                        if (kategoriTemiz === 'konser') {
                            resimUrl = "public/images/konser.jfif";
                        } else if (kategoriTemiz === 'stand-up' || kategoriTemiz === 'standup') {
                            resimUrl = "public/images/stand up.jfif"; 
                        } else if (kategoriTemiz === 'tiyatro' || kategoriTemiz === 'müzikal' || kategoriTemiz === 'opera' || kategoriTemiz === 'resital') {
                            resimUrl = "public/images/tiyatro.jfif";
                        } else if (kategoriTemiz === 'festival') {
                            resimUrl = "public/images/festival.jfif";
                        } else if (kategoriTemiz === 'sinema') {
                            resimUrl = "public/images/sinema.jfif";
                        }

                        let biletButonAlani = "";

                        if (etkinlikTarihi < simdi) {
                            biletButonAlani = `
                                <button disabled style="flex:1; background:#7f8c8d; color:white; border:none; padding:10px 16px; border-radius:10px; font-weight:700; font-size:14px; cursor:not-allowed; display:flex; align-items:center; justify-content:center; gap:8px;">
                                    <i class="fa-solid fa-calendar-xmark"></i> Etkinlik Bitti
                                </button>`;
                        } else if (etk.SatilanBilet >= etk.Kapasite) {
                            biletButonAlani = `
                                <button disabled style="flex:1; background:#ff7675; color:white; border:none; padding:10px 16px; border-radius:10px; font-weight:700; font-size:14px; cursor:not-allowed; display:flex; align-items:center; justify-content:center; gap:8px;">
                                    <i class="fa-solid fa-burst"></i> Biletler Tükendi
                                </button>`;
                        } else {
                            biletButonAlani = `
                                <button onclick="biletSatinAl(${etk.Etkinlik_ID}, ${kartFiyati})" style="flex:1; background: linear-gradient(135deg, #2ed573 0%, #26af5f 100%); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(46, 213, 115, 0.2); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; gap: 8px;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 18px rgba(46, 213, 115, 0.35)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(46, 213, 115, 0.2)';">
                                    <i class="fa-solid fa-cart-shopping" style="font-size: 13px;"></i> Bilet Al
                                </button>`;
                        }

                        grid.innerHTML += `
                            <div class="event-card" data-category="${etk.Etkinlik_Kategori}">
                                <div class="card-image-container" style="width: 100%; height: 180px; overflow: hidden; border-radius: 12px 12px 0 0; background: #eaeaea;">
                                    <img src="${resimUrl}" alt="${etk.Etkinlik_Adi}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;">
                                </div>
                                <div class="card-body">
                                    <span class="category-badge">${etk.Etkinlik_Kategori}</span>
                                    <h4 class="event-title">${etk.Etkinlik_Adi}</h4>
                                    <p class="event-info"><i class="fa-solid fa-location-dot"></i> ${etk.Mekan_Adi} (${etk.Sehir})</p>
                                    <p class="event-info"><i class="fa-solid fa-clock"></i> ${tarih}</p>
                                    <p class="event-info" style="font-weight:bold; color:#2d3436;"><i class="fa-solid fa-money-bill-wave" style="color:#2ed573;"></i> Fiyat: ${kartFiyati} TL</p>
                                    
                                    <div style="display:flex; gap:12px; margin-top:16px;">
                                        <a href="etkinlik-detay.html?id=${etk.Etkinlik_ID}" class="details-btn" style="flex:1; text-align:center; margin:0; padding: 10px; border-radius: 10px; font-weight: 600; border: 1px solid #eaeaea; color: #2d3436; text-decoration: none; transition: all 0.2s ease; display:flex; align-items:center; justify-content:center;">Detaylar</a>
                                        ${biletButonAlani}
                                    </div>
                                </div>
                            </div>`;
                    });
                })
                .catch(err => console.error("Etkinlikler yüklenirken hata oluştu:", err));
        });

        //   GELİŞTİRİLMİŞ KATEGORİ VE KONTENJAN SEÇİMLİ 
        function biletSatinAl(etkinlikID, tabanFiyat) {
            const katilimciID = localStorage.getItem('synapz_user_id');
            if (!katilimciID) {
                alert("Bilet satın alabilmek için lütfen önce sisteme giriş yapınız!");
                window.location.href = 'giris_kayit.html';
                return;
            }

            const secim = prompt(
                "Lütfen bilet kategorisini yazınız:\n\n" +
                "1 - Standart (Ham Fiyat)\n" +
                "2 - Kategori 3 (+%10 Ek Tutar)\n" +
                "3 - Kategori 2 (+%30 Ek Tutar)\n" +
                "4 - Kategori 1 (+%50 Ek Tutar)\n" +
                "5 - VIP (+%100 Ek Tutar)\n\n" +
                "Seçiminizi rakam olarak (1-5) giriniz:"
            );

            let secilenKategori = "Standart";
            let hesaplananFiyat = parseFloat(tabanFiyat);

            if (secim === "1") {
                secilenKategori = "Standart";
            } else if (secim === "2") {
                secilenKategori = "Kategori 3";
                hesaplananFiyat = tabanFiyat * 1.1;
            } else if (secim === "3") {
                secilenKategori = "Kategori 2";
                hesaplananFiyat = tabanFiyat * 1.3;
            } else if (secim === "4") {
                secilenKategori = "Kategori 1";
                hesaplananFiyat = tabanFiyat * 1.5;
            } else if (secim === "5") {
                secilenKategori = "VIP";
                hesaplananFiyat = tabanFiyat * 2.0;
            } else {
                alert("Geçersiz bir seçim yaptınız, işlem iptal edildi.");
                return;
            }

            //  Kategori standart değilse 1-5 arası Sıra ve 1-20 arası Koltuk seçtiriyoruz!
            let nihaiKoltukNo = "Ayakta / Numarasız";
            if (secilenKategori !== "Standart") {
                const secilenSira = prompt("Lütfen oturmak istediğiniz sıra numarasını giriniz (1 ile 5 arası):");
                if (!secilenSira || parseInt(secilenSira) < 1 || parseInt(secilenSira) > 5 || isNaN(secilenSira)) {
                    alert("Geçersiz veya boş sıra seçimi yapıldı, işlem iptal edildi.");
                    return;
                }

                const secilenKoltuk = prompt("Lütfen koltuk numarasını giriniz (1 ile 20 arası):");
                if (!secilenKoltuk || parseInt(secilenKoltuk) < 1 || parseInt(secilenKoltuk) > 20 || isNaN(secilenKoltuk)) {
                    alert("Geçersiz veya boş koltuk seçimi yapıldı, işlem iptal edildi.");
                    return;
                }

                nihaiKoltukNo = `Sıra ${secilenSira} - Koltuk ${secilenKoltuk}`;
            }

            if (!confirm(`Seçilen Kategori: ${secilenKategori}\nAtanan Alan: ${nihaiKoltukNo}\nHesaplanan Tutar: ${hesaplananFiyat.toFixed(2)} TL\n\nSatın alma işlemini onaylıyor musunuz?`)) return;

            //  Koltuk ve Kategori verilerini server.js API kapısına postalıyoruz
            fetch('/api/bilet-al', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    katilimciID: katilimciID, 
                    etkinlikID: etkinlikID, 
                    fiyat: hesaplananFiyat, 
                    kategori: secilenKategori,
                    koltukNo: nihaiKoltukNo // Koltuk no parametresi eklendi
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.basarili) {
                    alert("🎉 " + data.mesaj);
                    window.location.href = `profil.html?id=${katilimciID}`; 
                } else {
                    alert("❌ Bilet Alınamadı: " + data.mesaj);
                }
            })
            .catch(err => alert("Sistemsel bağlantı hatası."));
        }

        let currentSelectedCategory = 'hepsi';
        function filterCategory(category) {
            currentSelectedCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.getAttribute('data-category-type') === category) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            applyCombinedFilter();
        }

        function liveSearch() { applyCombinedFilter(); }

        function applyCombinedFilter() {
            const searchValue = document.getElementById('eventSearchInput').value.toLowerCase();
            document.querySelectorAll('.event-card').forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                const matchesCategory = (currentSelectedCategory === 'hepsi' || cardCategory === currentSelectedCategory);
                const matchesSearch = card.innerText.toLowerCase().includes(searchValue);
                card.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
            });
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loggedInID = localStorage.getItem('synapz_user_id');
            const loggedInName = localStorage.getItem('synapz_user_name');
            if (loggedInID && loggedInName) {
                const girisLink = document.getElementById('girisLink');
                if (girisLink) {
                    const kısaIsim = loggedInName.split(' ')[0]; 
                    girisLink.innerHTML = `<i class="fa-solid fa-circle-user"></i> ${kısaIsim}`;
                    girisLink.href = `profil.html?id=${loggedInID}`;
                }
            }
        });
    </script>
</body>
</html>
